<!DOCTYPE html>

<head>

            "on-secondary-container": "#dcb7ff",
            "surface-variant": "#353534",
            "secondary": "#dcb8ff",
            "tertiary-container": "#ef6719",
            "primary-fixed": "#d8e2ff",

            "on-surface": "#e5e2e1",

            "surface": "#131313",

            "on-tertiary-fixed-variant": "#7c2e00",
            "on-surface-variant": "#c1c6d7",
            "on-primary": "#002e69",
            "surface-container-high": "#2a2a2a",
            "tertiary-fixed": "#ffdbcc",
            "inverse-primary": "#005bc1",
            "surface-tint": "#adc6ff",
            "primary-container": "#4b8eff",
            "outline": "#8b90a0",
            "inverse-on-surface": "#313030",
            "on-secondary": "#480081",
            "secondary-fixed": "#efdbff",
            "outline-variant": "#414755",
            "on-background": "#e5e2e1",

          },
          borderRadius: {

  <style>
    body {
      background-color: #050505;
      color: #e5e2e1;
      font-family: 'Geist', sans-serif;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-image: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02), 0 8px 32px 0 rgba(0,0,0,0.5);
    }
    .ambient-glow-bg {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.12) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .form-animate { animation: fadeInUp 0.8s ease-out; }
    input, textarea {
      background-color: rgba(20, 20, 20, 0.8) !important;
      border-color: rgba(138, 43, 226, 0.3) !important;
      color: #e5e2e1 !important;
    }
    input:focus, textarea:focus {
      background-color: rgba(30, 30, 30, 0.9) !important;
      border-color: rgba(138, 43, 226, 0.8) !important;
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.3) !important;
    }
    input::placeholder { color: rgba(193, 198, 215, 0.6) !important; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 48px; }
    .toggle-password {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; color: rgba(255,255,255,0.8); cursor: pointer;
    }
    @keyframes float { 0%,100% { transform: translateY(0px);} 50% { transform: translateY(-20px);} }
    @keyframes rotate { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
    @keyframes pulse-opacity { 0%,100% { opacity: 0.3;} 50% { opacity: 0.8;} }
    @keyframes drift-left { 0% { transform: translateX(0px);} 50% { transform: translateX(-30px);} 100% { transform: translateX(0px);} }
    @keyframes drift-right { 0% { transform: translateX(0px);} 50% { transform: translateX(30px);} 100% { transform: translateX(0px);} }
    .float-element { animation: float 4s ease-in-out infinite; }
    .float-element-2 { animation: float 5s ease-in-out infinite; animation-delay: 1s; }
    .float-element-3 { animation: float 6s ease-in-out infinite; animation-delay: 2s; }
    .rotate-element { animation: rotate 20s linear infinite; }
    .pulse-element { animation: pulse-opacity 3s ease-in-out infinite; }
    .drift-left { animation: drift-left 6s ease-in-out infinite; }
    .drift-right { animation: drift-right 7s ease-in-out infinite; }
  </style>
</head>
<body class="antialiased selection:bg-primary-container selection:text-on-primary-container">
  <nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-[0_8px_32px_0_rgba(0,0,0,0.3)]">
    <div class="flex justify-between items-center h-20 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto">
      <a href="get-started.html" class="font-headline-md text-headline-md font-bold text-on-surface tracking-tighter cursor-pointer hover:opacity-80 transition-all duration-300 no-underline">Scale IT OS</a>
      <div class="md:flex">
        <a href="get-started.html" class="text-on-surface-variant hover:text-on-surface transition-colors font-body-md text-body-md no-underline">← Back</a>
      </div>
    </div>
  </nav>

  <section class="relative min-h-screen flex items-center justify-center overflow-hidden pt-20 pb-20">
    <div class="absolute inset-0 w-full h-full z-0 opacity-20" style="background-image: linear-gradient(135deg, rgba(138,43,226,0.1) 0%, rgba(0,0,0,0) 100%);"></div>
    <div class="ambient-glow-bg top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0"></div>

    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
      <div class="absolute top-10 left-10 w-32 h-32 rounded-full border border-purple-500/20 float-element" style="box-shadow: 0 0 30px rgba(138, 43, 226, 0.15);"></div>
      <div class="absolute top-1/3 right-20 w-40 h-40 rounded-full border border-purple-600/20 float-element-2" style="box-shadow: 0 0 40px rgba(138, 43, 226, 0.1);"></div>
      <div class="absolute bottom-1/4 left-1/4 w-24 h-24 rounded-full border border-purple-400/20 float-element-3 drift-left" style="box-shadow: 0 0 25px rgba(138, 43, 226, 0.12);"></div>
      <div class="absolute bottom-10 right-1/3 w-32 h-32 rounded-full border border-purple-500/15 drift-right pulse-element" style="box-shadow: 0 0 35px rgba(138, 43, 226, 0.1);"></div>
      <div class="absolute top-1/2 right-1/4 w-20 h-20 border-2 border-transparent border-t-purple-500 border-r-purple-600 rounded-full rotate-element opacity-30"></div>
    </div>

    <div class="relative z-20 w-full max-w-md mx-auto px-margin-mobile form-animate">
      <div class="glass-panel p-8 rounded-2xl space-y-6">
        <div class="text-center mb-8">
          <div class="inline-flex items-center gap-2 mb-4">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-500 to-purple-700 flex items-center justify-center">
              <span class="material-symbols-outlined text-white text-2xl">shield</span>
            </div>
          </div>
          <h1 class="font-headline-lg text-headline-lg text-white mb-2">Scale IT OS Admin</h1>
          <p class="font-body-sm text-on-surface-variant">Secure access for system-wide oversight and control.</p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block font-body-sm text-on-surface-variant mb-2">Admin Email</label>
            <input type="email" placeholder="Enter your admin email" class="w-full px-4 py-3 rounded-lg font-body-sm focus:outline-none transition-all">
          </div>
          <div>
            <label class="block font-body-sm text-on-surface-variant mb-2">Password</label>
            <div class="password-wrap">
              <input id="admin-password" type="password" placeholder="Enter your password" class="w-full px-4 py-3 rounded-lg font-body-sm focus:outline-none transition-all">
              <button type="button" class="toggle-password" data-target="admin-password" aria-label="Show password">
                <span class="material-symbols-outlined text-base">visibility</span>
              </button>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 font-body-sm text-on-surface-variant cursor-pointer">
              <input type="checkbox" class="rounded">
              Remember me
            </label>
            <a href="#" class="font-body-sm text-primary hover:text-primary/80 transition-colors no-underline">Need help?</a>
          </div>
          <button onclick="handleLogin('scale-it-admin')" class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 text-white py-3 rounded-lg font-label-mono text-label-mono text-sm transition-all duration-300 shadow-[0_0_20px_rgba(138,43,226,0.4)] hover:shadow-[0_0_30px_rgba(138,43,226,0.6)] uppercase tracking-wider flex items-center justify-center gap-2">
            Sign In
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </div>

        <div class="pt-4 border-t border-white/10 text-center">
          <p class="font-body-sm text-on-surface-variant mb-2">Access requires platform-level approval.</p>
          <a href="get-started.html" class="font-label-mono text-label-mono text-primary hover:text-primary/80 transition-colors no-underline">Choose another role</a>
        </div>
      </div>
    </div>
  </section>

  <script>
    document.querySelectorAll('.toggle-password').forEach((button) => {
      button.addEventListener('click', function () {
        const input = document.getElementById(this.dataset.target);
        const icon = this.querySelector('span');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        icon.textContent = isHidden ? 'visibility_off' : 'visibility';
      });
    });

    function handleLogin(role) {
      localStorage.setItem('userRole', role);
      if (role === 'scale-it-admin') {
        window.location.href = 'dashboard-scale-it-admin.html';
      }
    }
  </script>
</body>
</html>
