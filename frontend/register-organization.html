<h1 class="font-headline-lg text-headline-lg text-white mb-2">Create Your Organization</h1>
<p class="font-body-sm text-on-surface-variant">Set up your Scale IT OS workspace</p>
</div>

<div class="space-y-4">
<div>
<label class="block font-body-sm text-on-surface-variant mb-2">Organization Name</label>
<input id="reg-org-name" type="text" placeholder="Your Company Inc." class="w-full px-4 py-3 rounded-lg font-body-sm focus:outline-none transition-all">
</div>
<div>
<label class="block font-body-sm text-on-surface-variant mb-2">Admin Full Name</label>
<input id="reg-admin-name" type="text" placeholder="John Doe" class="w-full px-4 py-3 rounded-lg font-body-sm focus:outline-none transition-all">
</div>
<div>
<label class="block font-body-sm text-on-surface-variant mb-2">Organization Email</label>
<input id="reg-email" type="email" placeholder="admin@company.com" class="w-full px-4 py-3 rounded-lg font-body-sm focus:outline-none transition-all">
</div>
<div>
<label class="block font-body-sm text-on-surface-variant mb-2">Phone Number</label>
<input id="reg-phone" type="tel" placeholder="+1 (555) 000-0000" class="w-full px-4 py-3 rounded-lg font-body-sm focus:outline-none transition-all">
</div>
<div>
<label class="block font-body-sm text-on-surface-variant mb-2">Password</label>
<input id="reg-password" type="password" placeholder="Create a strong password" class="w-full px-4 py-3 rounded-lg font-body-sm focus:outline-none transition-all">
</div>
<div>
<label class="block font-body-sm text-on-surface-variant mb-2">Confirm Password</label>
<input id="reg-confirm-password" type="password" placeholder="Confirm your password" class="w-full px-4 py-3 rounded-lg font-body-sm focus:outline-none transition-all">
</div>

<button onclick="handleRegister()" class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 text-white py-3 rounded-lg font-label-mono text-label-mono text-sm transition-all duration-300 shadow-[0_0_20px_rgba(138,43,226,0.4)] hover:shadow-[0_0_30px_rgba(138,43,226,0.6)] uppercase tracking-wider flex items-center justify-center gap-2">
                    Create Organization
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>

<script>
async function handleRegister() {
    const organizationName = document.getElementById('reg-org-name').value;
    const adminFullName = document.getElementById('reg-admin-name').value;
    const ownerEmail = document.getElementById('reg-email').value;
    const phoneNumber = document.getElementById('reg-phone').value;
    const password = document.getElementById('reg-password').value;
    const confirmPassword = document.getElementById('reg-confirm-password').value;

    if (!organizationName || !adminFullName || !ownerEmail || !password) {
        alert('Please fill in all required fields');
        return;
    }

    if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
    }

    try {
        const response = await fetch('http://localhost:3000/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ organizationName, adminFullName, ownerEmail, phoneNumber, password })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || 'Registration failed');
            return;
        }

        document.getElementById('registrationForm').style.display = 'none';
        document.getElementById('successState').classList.add('active');
    } catch (err) {
        alert('Could not connect to server. Make sure backend is running.');
    }
}

function continueToLogin() {
    window.location.href = 'login-organization.html';
}
</script>
